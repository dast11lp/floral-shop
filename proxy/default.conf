server {
    listen 80;
    server_name _;

    # Única ruta que llega al backend: la API versionada.
    location /api/v1/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás se rechaza (incluido /actuator).
    # En la fase 5 aquí se servirá el frontend de Angular.
    location / {
        return 404;
    }
}